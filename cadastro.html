<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#10100f"><title>Criar conta — Barbearia Elite</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body data-page="register" class="form-page"><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">BE</span><span>BARBEARIA <b>ELITE</b></span></a><a class="text-link" href="index.html">← Voltar ao início</a></header><main class="form-layout"><div class="form-image register-image" role="img" aria-label="Detalhes de uma cadeira clássica de barbeiro"></div><section class="form-panel"><p class="eyebrow">FAÇA PARTE DA ELITE</p><h1>Seu próximo<br><em>capítulo começa.</em></h1><p class="form-intro">Crie sua conta e agende seu próximo estilo.</p><form id="register-form" novalidate><label for="register-name">Nome completo</label><input id="register-name" name="name" type="text" autocomplete="name" placeholder="Como podemos chamar você?" required minlength="3"><label for="register-email">E-mail</label><input id="register-email" name="email" type="email" autocomplete="email" placeholder="voce@email.com" required><label for="register-phone">Telefone</label><input id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999" required><div class="form-row"><div><label for="register-password">Senha</label><input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres" required minlength="8"></div><div><label for="register-confirm">Confirmar senha</label><input id="register-confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repita a senha" required></div></div><p class="form-error" id="register-error" role="alert" aria-live="polite"></p><button class="button button-gold button-full" type="submit">Criar minha conta <span>↗</span></button></form><p class="form-switch">Já tem uma conta? <a href="login.html">Entrar</a></p></section></main><footer class="footer"><a class="brand" href="index.html"><span class="brand-mark">BE</span><span>BARBEARIA <b>ELITE</b></span></a><span>© 2025 Barbearia Elite</span></footer></body></html>
